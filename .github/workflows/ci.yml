name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Validate compose files
        env:
          DB_PASSWORD: ci-only
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile runner config --quiet

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: End-to-end release lifecycle
        run: sh test/e2e/run.sh

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: test/e2e/last-run.log
