name: shipflow

# Settings shared by the API and worker. Values from .env are loaded first;
# these override the host-oriented defaults for the compose network.
x-app-environment: &app-environment
  PORT: "8000"
  SITE_PORT: "8080"
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  INTERNAL_API_URL: http://api:8000
  INTERNAL_SITE_URL: http://api:8080

x-app-env-file: &app-env-file
  - path: .env
    required: false

services:

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-shipflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-shipflow}

    # No published ports: only reachable on the internal compose network.

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-shipflow} -d ${DB_NAME:-shipflow}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

    # No published ports: only reachable on the internal compose network.

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shipflow-app:latest
    restart: unless-stopped
    command: ["node", "index.js"]
    user: node

    env_file: *app-env-file
    environment:
      <<: *app-environment

    # Bound to localhost by default; put a TLS reverse proxy in front for
    # remote access, or set API_BIND / SITE_BIND deliberately.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
      - "${SITE_BIND:-127.0.0.1}:${SITE_HOST_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  worker:
    image: shipflow-app:latest
    pull_policy: never
    restart: unless-stopped
    command: ["node", "worker.js"]

    # Root inside this container is needed to use the Docker socket.
    # Repository code never runs here: it runs in separate sandbox
    # containers that get no secrets, mounts, or socket.
    user: root

    env_file: *app-env-file
    environment:
      <<: *app-environment
      SHIPFLOW_SANDBOX: docker
      SHIPFLOW_WORKSPACE_ROOT: /workspaces

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspaces:/workspaces

    depends_on:
      api:
        condition: service_healthy


volumes:

  postgres_data:

  redis_data:

  workspaces:
