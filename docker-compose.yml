services:

  postgres:
    image: postgres:17
    container_name: vircle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vircle
      POSTGRES_PASSWORD: vircle123
      POSTGRES_DB: vircle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vircle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: vircle-api
    restart: unless-stopped
    command: node index.js
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: vircle
      DB_PASSWORD: vircle123
      DB_NAME: vircle
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    container_name: vircle-worker
    restart: unless-stopped
    command: node worker.js
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: vircle
      DB_PASSWORD: vircle123
      DB_NAME: vircle
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: