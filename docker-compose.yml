name: shipflow

# Settings shared by the API and worker. Values from .env are loaded first;
# these override the host-oriented defaults for the compose network.
x-app-environment: &app-environment
  PORT: "8000"
  SITE_PORT: "8080"
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  INTERNAL_API_URL: http://api:8000
  INTERNAL_SITE_URL: http://api:8080
  # Used when no S3 bucket is configured (SHIPFLOW_ARTIFACT_STORE=local).
  SHIPFLOW_ARTIFACT_DIR: /var/lib/shipflow/artifacts

x-app-env-file: &app-env-file
  - path: .env
    required: false

services:

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-shipflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-shipflow}

    # No published ports: only reachable on the internal compose network.

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-shipflow} -d ${DB_NAME:-shipflow}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

    # No published ports: only reachable on the internal compose network.

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shipflow-app:latest
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    user: node

    env_file: *app-env-file
    environment:
      <<: *app-environment

    volumes:
      - artifacts:/var/lib/shipflow/artifacts

    # Bound to localhost by default; put a TLS reverse proxy in front for
    # remote access, or set API_BIND / SITE_BIND deliberately.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
      - "${SITE_BIND:-127.0.0.1}:${SITE_HOST_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  worker:
    image: shipflow-app:latest
    pull_policy: never
    restart: unless-stopped
    command: ["node", "dist/worker.js"]

    # Root inside this container is needed to use the Docker socket.
    # Repository code never runs here: it runs in separate sandbox
    # containers that get no secrets, mounts, or socket.
    user: root

    env_file: *app-env-file
    environment:
      <<: *app-environment
      SHIPFLOW_SANDBOX: docker
      SHIPFLOW_WORKSPACE_ROOT: /workspaces
      # Sandboxes join an internal-only network; their only way out is the
      # egress proxy, and only while dependencies install.
      SHIPFLOW_SANDBOX_NETWORK: ${SHIPFLOW_SANDBOX_NETWORK_NAME:-shipflow-sandbox}
      SHIPFLOW_EGRESS_PROXY: http://egress-proxy:3128

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspaces:/workspaces
      - artifacts:/var/lib/shipflow/artifacts

    depends_on:
      api:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy


  # Allows sandboxes HTTPS access to package registries only (see
  # src/egressProxy.ts). Set SHIPFLOW_EGRESS_ALLOWLIST to change the list.
  egress-proxy:
    image: shipflow-app:latest
    pull_policy: never
    restart: unless-stopped
    command: ["node", "dist/src/egressProxy.js"]
    user: node
    environment:
      SHIPFLOW_EGRESS_ALLOWLIST: ${SHIPFLOW_EGRESS_ALLOWLIST:-registry.npmjs.org,registry.yarnpkg.com,repo.yarnpkg.com}
    networks:
      - default
      - sandbox
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3128/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy


networks:

  # Internal: no route to the internet, the host, or other networks.
  sandbox:
    name: ${SHIPFLOW_SANDBOX_NETWORK_NAME:-shipflow-sandbox}
    internal: true


volumes:

  postgres_data:

  redis_data:

  workspaces:

  # Release artifacts when using local storage. Back this up: rollback
  # needs it.
  artifacts:
