# Serves whatever the "current" symlink points to; nginx resolves the
# symlink per request, so an atomic switch is visible immediately.
server {
  listen 8081;
  root /srv/site/current;
  index index.html;
  add_header Cache-Control no-cache;
}

server {
  listen 8082;
  root /srv/site2/current;
  index index.html;
  add_header Cache-Control no-cache;
}
